litellm_settings:
  drop_params: true        # strips unsupported params (fixes DeepSeek reasoning_content issue)
  set_verbose: false
  spend_logs: true         # logs spend to JSON log file — no database needed (ISSUE-6)
  log_file: logs/litellm.log # persistent log file (ISSUE-5)
