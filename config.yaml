  # Automatic fallback: if a model fails (e.g., rate limit), try the next one
  # Usage: set model="fallback-deepseek" in your client to use this chain
  - model_name: fallback-deepseek
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      mode: chat
      max_tokens: 65536
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028
    fallback:
      - model_name: claude-sonnet
        litellm_params:
          model: anthropic/claude-sonnet-4-6
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: groq-llama
        litellm_params:
          model: groq/llama-3.3-70b-versatile
          api_key: os.environ/GROQ_API_KEY

  # Model aliases — convenience names that route to the best model for each task.
  # These are registered as proper model_list entries so the proxy recognizes them.
  # Usage: set model="best-coding" in your client
