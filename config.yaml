model_list:
  # DeepSeek — best for coding
  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

  # Anthropic Claude
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  # Groq — fast inference
  - model_name: groq-llama
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  # Mistral — strong European models
  - model_name: mistral-large
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: codestral
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY

  # Moonshot / Kimi
  - model_name: kimi-latest
    litellm_params:
      model: moonshot/moonshot-v1-128k
      api_key: os.environ/KIMI_API_KEY

  # Ollama — local, free
  - model_name: deepseek-local
    litellm_params:
      model: ollama/deepseek-v4-pro:cloud
      api_base: http://localhost:11434

  # Automatic fallback: if a model fails (e.g., rate limit), try the next one
  # Usage: set model="fallback-deepseek" in your client to use this chain
  - model_name: fallback-deepseek
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
    fallback:
      - model_name: claude-sonnet
        litellm_params:
          model: anthropic/claude-sonnet-4-6
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: groq-llama
        litellm_params:
          model: groq/llama-3.3-70b-versatile
          api_key: os.environ/GROQ_API_KEY

litellm_settings:
  drop_params: true        # strips unsupported params (fixes DeepSeek reasoning_content issue)
  set_verbose: false
  spend_logs: true         # enable usage / cost tracking (ISSUE-6)
  log_file: logs/litellm.log # persistent log file (ISSUE-5)
